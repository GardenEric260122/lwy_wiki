name: CSS 版本号校验

# 当 common.css 有改动时，校验其版本号是否已递增。
# 若 CSS 内容变了但 --wy-css-version 没变 → 失败，提醒运行 bump_css_version.py。
on:
  push:
    paths:
      - 'styles/common.css'
  pull_request:
    paths:
      - 'styles/common.css'

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库（含历史）
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验版本号是否递增
        run: |
          CSS="styles/common.css"

          # 取当前版本号
          cur=$(grep -oE '\-\-wy-css-version:\s*"[0-9.]+"' "$CSS" | grep -oE '[0-9.]+')
          echo "当前 common.css 版本：$cur"

          # 找 diff 的基准提交：PR 用 base，push 用前一提交
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi

          # 基准不存在（如首次推送）则跳过校验
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "ℹ️ 无有效基准提交，跳过校验"
            exit 0
          fi

          # 基准中该文件不存在（新文件）→ 跳过
          if ! git cat-file -e "$base:$CSS" 2>/dev/null; then
            echo "ℹ️ 基准中无 common.css（新文件），跳过校验"
            exit 0
          fi

          # 比较内容与版本号
          if git diff --quiet "$base" HEAD -- "$CSS"; then
            echo "ℹ️ common.css 无实际改动，通过"
            exit 0
          fi

          old=$(git show "$base:$CSS" | grep -oE '\-\-wy-css-version:\s*"[0-9.]+"' | grep -oE '[0-9.]+')
          echo "基准版本：$old  →  当前版本：$cur"

          if [ "$old" = "$cur" ]; then
            echo "::error::common.css 内容已改动，但版本号仍为 $cur 未递增。"
            echo "::error::请运行 python bump_css_version.py --level <major|minor|patch> --execute 更新版本号。"
            exit 1
          fi

          echo "✅ 版本号已从 $old 递增到 $cur，校验通过"
